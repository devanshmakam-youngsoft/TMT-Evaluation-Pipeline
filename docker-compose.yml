services:
  eval-automation:
    build: .
    restart: unless-stopped
    environment:
      EVAL_BASE_URL: "2"
    volumes:
      - ./incoming:/app/eval_automation/incoming
      - ./reports:/app/eval_automation/reports
      # Reuses your host's `az login` session for Azure OpenAI auth
      # (nlp_score/llm_judge) - local-dev-only, run `az login` on the host
      # first if this container ever reports no cached account.
      - ~/.azure:/root/.azure
